<script type="text/javascript">
RED.nodes.registerType('waterkotte-config', {
    category: 'config',
    defaults: {
        name:     { value: '' },
        host:     { value: '', required: true },
        port:     { value: 80, validate: RED.validators.number() },
        protocol: { value: 'http' },
        timeout:  { value: 10000, validate: RED.validators.number() }
    },
    credentials: {
        username: { type: 'text' },
        password: { type: 'password' }
    },
    label: function () {
        return this.name || (this.host ? `Waterkotte (${this.host})` : 'Waterkotte');
    }
});
</script>

<script type="text/html" data-template-name="waterkotte-config">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="optional">
    </div>
    <div class="form-row">
        <label for="node-config-input-protocol"><i class="fa fa-globe"></i> Protokoll</label>
        <select id="node-config-input-protocol" style="width:120px">
            <option value="http">http</option>
            <option value="https">https</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-host"><i class="fa fa-server"></i> Host</label>
        <input type="text" id="node-config-input-host" placeholder="192.168.x.x">
    </div>
    <div class="form-row">
        <label for="node-config-input-port"><i class="fa fa-plug"></i> Port</label>
        <input type="number" id="node-config-input-port" style="width:120px">
    </div>
    <div class="form-row">
        <label for="node-config-input-username"><i class="fa fa-user"></i> Username</label>
        <input type="text" id="node-config-input-username">
    </div>
    <div class="form-row">
        <label for="node-config-input-password"><i class="fa fa-lock"></i> Password</label>
        <input type="password" id="node-config-input-password">
    </div>
    <div class="form-row">
        <label for="node-config-input-timeout"><i class="fa fa-clock-o"></i> Timeout (ms)</label>
        <input type="number" id="node-config-input-timeout" style="width:120px">
    </div>
</script>

<script type="text/html" data-help-name="waterkotte-config">
    <p>Connection to a Waterkotte heat pump with the EcoTouch / IDAL CGI interface
    (typically on the local LAN at port 80).</p>
    <h3>Defaults</h3>
    <ul>
        <li>Username / password: <code>waterkotte</code> / <code>waterkotte</code> on most installations</li>
        <li>Token is fetched automatically and refreshed on 401</li>
    </ul>
</script>
